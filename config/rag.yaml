# RAG Configuration
llm:
  provider: "openai"  # openai, anthropic, local
  model: "gpt-4-turbo-preview"
  temperature: 0.1
  max_tokens: 2000

context:
  max_chunks: 5
  chunk_context_window: 2
  include_metadata: true
  metadata_fields: ["title", "authors", "year", "venue"]

citation:
  enable: true
  format: "numerical"
  include_page_numbers: false

cache:
  enable: true
  ttl_hours: 24
  max_size_mb: 1000